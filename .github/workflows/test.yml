name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: homebrew/actions/setup-homebrew@master
      - run: brew install --build-from-source Formula/llm-archive.rb
      - run: brew test llm-archive
      - run: brew audit --strict llm-archive
